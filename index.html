<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="使わなかった小さなお金を記録し、貯金額と成長を見られるアプリ。"
    />
    <meta name="theme-color" content="#1E7F63" />
    <meta property="og:title" content="誤差貯金" />
    <meta
      property="og:description"
      content="使わなかった小さなお金を記録し、貯金額と成長を見られるアプリ。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./public/icons/app-icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="誤差貯金" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./public/icons/app-icon-192.png" />
    <title>誤差貯金</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f6f3;
        --paper: #ffffff;
        --paper-soft: #fbfcf9;
        --mint: #edf5f1;
        --mint-strong: #dceee6;
        --ink: #17201c;
        --muted: #78817b;
        --line: rgba(23, 32, 28, 0.1);
        --green: #1e7f63;
        --green-deep: #10634c;
        --gold: #d8a437;
        --orange: #df8d54;
        --shadow: 0 18px 50px rgba(27, 54, 43, 0.12);
        font-family: "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--bg);
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 12% 8%, rgba(30, 127, 99, 0.1), transparent 28rem),
          radial-gradient(circle at 88% 12%, rgba(216, 164, 55, 0.16), transparent 24rem),
          linear-gradient(160deg, #fbfbf3 0%, #eef6f1 48%, #f8f3e8 100%);
        color: var(--ink);
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      .app {
        width: min(100%, 520px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 18px 14px 22px;
      }

      .shell {
        min-height: calc(100vh - 40px);
        border: 1px solid var(--line);
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 22px 22px 16px;
        background: linear-gradient(135deg, rgba(237, 245, 241, 0.98), rgba(255, 255, 255, 0.96));
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-icon {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        background: var(--mint);
        object-fit: contain;
        padding: 4px;
      }

      .brand-title {
        margin: 0;
        color: var(--green-deep);
        font-size: 22px;
        line-height: 1.2;
      }

      .brand-sub {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .screen {
        display: none;
        min-height: 680px;
        padding: 18px 18px 104px;
      }

      .screen.is-active {
        display: block;
      }

      .hero-card,
      .panel,
      .record-card,
      .empty-card {
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--paper);
        box-shadow: 0 12px 28px rgba(27, 54, 43, 0.08);
      }

      .hero-card {
        display: grid;
        gap: 18px;
        padding: 20px;
        background: linear-gradient(145deg, var(--mint), #fff 72%);
      }

      .hero-main {
        display: grid;
        grid-template-columns: 1fr 126px;
        align-items: center;
        gap: 16px;
      }

      .label {
        display: block;
        color: var(--green-deep);
        font-size: 13px;
        font-weight: 900;
      }

      .total-amount {
        margin: 4px 0 0;
        color: var(--ink);
        font-size: clamp(42px, 13vw, 62px);
        font-weight: 950;
        line-height: 1.05;
        letter-spacing: 0;
      }

      .month-pill {
        display: inline-flex;
        width: fit-content;
        margin-top: 12px;
        border-radius: 999px;
        background: var(--green);
        color: #fff;
        padding: 8px 14px;
        font-size: 14px;
        font-weight: 900;
      }

      .mascot-wrap {
        position: relative;
        display: grid;
        place-items: center;
        width: 126px;
        height: 126px;
        border-radius: 36px;
        background: rgba(255, 255, 255, 0.8);
      }

      .mascot-wrap::before,
      .mascot-wrap::after {
        position: absolute;
        pointer-events: none;
      }

      .mascot-wrap::before {
        content: "";
        inset: 14px;
        border-radius: 999px;
        background: rgba(216, 164, 55, 0.12);
        transform: scale(var(--aura-scale, 0.7));
      }

      .mascot {
        position: relative;
        z-index: 2;
        width: 92px;
        height: 92px;
        object-fit: contain;
        filter: drop-shadow(0 10px 16px rgba(16, 99, 76, 0.16));
        transform: scale(var(--mascot-scale, 0.86));
      }

      .mascot-wrap::after {
        content: var(--mascot-badge, "");
        z-index: 3;
        right: 8px;
        top: 6px;
        color: var(--gold);
        font-size: 28px;
        font-weight: 900;
        text-shadow: 0 2px 0 rgba(255, 255, 255, 0.8);
      }

      .stage-0 { --mascot-scale: 0.78; --aura-scale: 0.45; }
      .stage-1 { --mascot-scale: 0.84; --aura-scale: 0.62; --mascot-badge: "＊"; }
      .stage-2 { --mascot-scale: 0.92; --aura-scale: 0.78; --mascot-badge: "✦"; }
      .stage-3 { --mascot-scale: 1; --aura-scale: 0.94; --mascot-badge: "✿"; }
      .stage-4 { --mascot-scale: 1.05; --aura-scale: 1.08; --mascot-badge: "★"; }
      .stage-5 { --mascot-scale: 1.1; --aura-scale: 1.18; --mascot-badge: "♛"; }

      .stage-text {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      .primary-button {
        width: 100%;
        border-radius: 22px;
        background: var(--green);
        color: #fff;
        padding: 17px 18px;
        font-size: 18px;
        font-weight: 950;
        box-shadow: 0 16px 30px rgba(30, 127, 99, 0.22);
      }

      .secondary-button {
        border-radius: 18px;
        background: var(--mint);
        color: var(--green-deep);
        padding: 12px 14px;
        font-weight: 900;
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 22px 0 12px;
      }

      .section-title h2 {
        margin: 0;
        color: var(--ink);
        font-size: 18px;
      }

      .muted {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .history-list,
      .stats-grid,
      .category-list,
      .profile-grid {
        display: grid;
        gap: 10px;
      }

      .record-card {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        padding: 14px 16px;
      }

      .record-card p {
        margin: 0;
        font-weight: 900;
      }

      .record-card small {
        color: var(--muted);
        font-weight: 700;
      }

      .record-card strong {
        color: var(--green);
        font-size: 18px;
      }

      .empty-card {
        padding: 18px;
        color: var(--muted);
        font-weight: 700;
        line-height: 1.7;
      }

      .form-card {
        display: grid;
        gap: 16px;
        border: 1px solid var(--line);
        border-radius: 26px;
        background: var(--paper);
        padding: 18px;
        box-shadow: 0 14px 30px rgba(27, 54, 43, 0.08);
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field label,
      .category-label {
        color: var(--green-deep);
        font-size: 13px;
        font-weight: 900;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid rgba(23, 32, 28, 0.12);
        border-radius: 18px;
        background: var(--paper-soft);
        color: var(--ink);
        outline: none;
        padding: 14px 15px;
      }

      input:focus,
      textarea:focus {
        border-color: rgba(30, 127, 99, 0.45);
        box-shadow: 0 0 0 4px rgba(30, 127, 99, 0.1);
      }

      .amount-input {
        font-size: 34px;
        font-weight: 950;
        letter-spacing: 0;
      }

      textarea {
        min-height: 92px;
        resize: vertical;
      }

      .category-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .category-chip {
        border: 1px solid rgba(23, 32, 28, 0.1);
        border-radius: 999px;
        background: #fff;
        color: var(--muted);
        padding: 10px 13px;
        font-size: 14px;
        font-weight: 900;
      }

      .category-chip.is-selected {
        border-color: transparent;
        background: var(--green);
        color: #fff;
      }

      .example-box {
        border-radius: 18px;
        background: var(--mint);
        color: var(--green-deep);
        padding: 12px 14px;
        font-size: 13px;
        font-weight: 800;
        line-height: 1.6;
      }

      .inline-form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }

      .panel {
        padding: 16px;
      }

      .stat-card {
        display: grid;
        gap: 4px;
        border-radius: 20px;
        background: var(--mint);
        padding: 16px;
      }

      .stat-card span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .stat-card strong {
        color: var(--green-deep);
        font-size: 24px;
      }

      .bar-list {
        display: grid;
        gap: 12px;
      }

      .bar-row {
        display: grid;
        grid-template-columns: 82px 1fr 86px;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      .bar-track {
        height: 16px;
        border-radius: 999px;
        background: var(--mint);
        overflow: hidden;
      }

      .bar-fill {
        width: var(--width);
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--green), var(--gold));
      }

      .profile-card {
        border-radius: 22px;
        background: var(--mint);
        padding: 16px;
      }

      .profile-card span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .profile-card strong {
        display: block;
        margin-top: 4px;
        color: var(--green-deep);
        font-size: 22px;
      }

      .danger-button {
        width: 100%;
        border-radius: 18px;
        background: #fff4ef;
        color: #9b3f26;
        padding: 13px 16px;
        font-weight: 900;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 86px;
        z-index: 20;
        width: min(calc(100% - 36px), 460px);
        transform: translateX(-50%);
        border-radius: 18px;
        background: var(--ink);
        color: #fff;
        padding: 12px 14px;
        text-align: center;
        font-weight: 800;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .toast.is-visible {
        opacity: 1;
        transform: translateX(-50%) translateY(-6px);
      }

      .bottom-nav {
        position: fixed;
        left: 50%;
        bottom: 14px;
        z-index: 10;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        width: min(calc(100% - 32px), 488px);
        border: 1px solid var(--line);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 14px 34px rgba(27, 54, 43, 0.14);
        padding: 6px;
        transform: translateX(-50%);
      }

      .nav-button {
        border-radius: 18px;
        background: transparent;
        color: var(--muted);
        padding: 10px 4px;
        font-size: 12px;
        font-weight: 900;
      }

      .nav-button.is-active {
        background: var(--mint);
        color: var(--green-deep);
      }

      @media (max-width: 420px) {
        .app {
          padding: 0;
        }

        .shell {
          min-height: 100vh;
          border: 0;
          border-radius: 0;
        }

        .hero-main {
          grid-template-columns: 1fr 108px;
        }

        .mascot-wrap {
          width: 108px;
          height: 108px;
        }

        .mascot {
          width: 82px;
          height: 82px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="shell">
        <header class="topbar">
          <div class="brand">
            <img class="brand-icon" src="./output/imagegen/mascot-trimmed.png" alt="" />
            <div>
              <h1 class="brand-title">誤差貯金</h1>
              <p class="brand-sub">守れたお金を育てる</p>
            </div>
          </div>
          <button class="secondary-button" type="button" data-nav="add">記録</button>
        </header>

        <section class="screen is-active" id="screen-home" aria-labelledby="home-title">
          <section class="hero-card">
            <div class="hero-main">
              <div>
                <span class="label">合計貯金額</span>
                <div class="total-amount" id="home-total">¥0</div>
                <div class="month-pill" id="home-month">今月 ¥0</div>
              </div>
              <div class="mascot-wrap stage-0" id="home-mascot">
                <img class="mascot" src="./output/imagegen/mascot-trimmed.png" alt="成長するキャラクター" />
              </div>
            </div>
            <div class="stage-text">
              <span id="stage-name">はじまり</span>
              <span id="record-count">0件記録</span>
            </div>
            <button class="primary-button" type="button" data-nav="add">誤差を記録する</button>
          </section>

          <div class="section-title">
            <h2 id="home-title">最近の記録</h2>
            <span class="muted" id="latest-label">まだ記録はありません</span>
          </div>
          <div class="history-list" id="history-list"></div>
        </section>

        <section class="screen" id="screen-add" aria-labelledby="add-title">
          <div class="section-title">
            <h2 id="add-title">誤差を記録</h2>
            <span class="muted">入力中は画面を固定</span>
          </div>

          <form class="form-card" id="record-form">
            <div class="field">
              <label for="amount-input">使わなかった金額</label>
              <input
                class="amount-input"
                id="amount-input"
                name="amount"
                type="number"
                inputmode="numeric"
                min="1"
                placeholder="0"
                autocomplete="off"
              />
            </div>

            <div class="field">
              <span class="category-label">カテゴリ</span>
              <div class="category-chips" id="category-chips" role="radiogroup" aria-label="カテゴリ"></div>
              <div class="example-box" id="category-example">カテゴリを選んでください。</div>
            </div>

            <div class="inline-form">
              <input id="new-category-input" type="text" placeholder="カテゴリを追加" autocomplete="off" />
              <button class="secondary-button" type="button" id="add-category-button">追加</button>
            </div>

            <div class="field">
              <label for="memo-input">何を使わなかった？</label>
              <textarea
                id="memo-input"
                name="memo"
                placeholder="例：タクシーを使わず歩けた"
                autocomplete="off"
              ></textarea>
            </div>

            <div class="field">
              <label for="date-input">日付</label>
              <input id="date-input" name="date" type="date" />
            </div>

            <button class="primary-button" type="submit">記録する</button>
          </form>
        </section>

        <section class="screen" id="screen-stats" aria-labelledby="stats-title">
          <div class="section-title">
            <h2 id="stats-title">統計</h2>
            <span class="muted">月別・カテゴリ別</span>
          </div>

          <div class="stats-grid">
            <div class="stat-card">
              <span>合計貯金額</span>
              <strong id="stats-total">¥0</strong>
            </div>
            <div class="stat-card">
              <span>今月守れたお金</span>
              <strong id="stats-month">¥0</strong>
            </div>
          </div>

          <div class="section-title">
            <h2>月ごとの貯金額</h2>
          </div>
          <section class="panel">
            <div class="bar-list" id="month-bars"></div>
          </section>

          <div class="section-title">
            <h2>カテゴリ別の貯金額</h2>
          </div>
          <section class="panel">
            <div class="bar-list" id="category-bars"></div>
          </section>
        </section>

        <section class="screen" id="screen-profile" aria-labelledby="profile-title">
          <div class="section-title">
            <h2 id="profile-title">マイページ</h2>
            <span class="muted">保存はこの端末内</span>
          </div>

          <div class="profile-grid">
            <div class="profile-card">
              <span>成長ステージ</span>
              <strong id="profile-stage">はじまり</strong>
            </div>
            <div class="profile-card">
              <span>記録回数</span>
              <strong id="profile-count">0件</strong>
            </div>
            <div class="profile-card">
              <span>カテゴリ数</span>
              <strong id="profile-categories">6個</strong>
            </div>
          </div>

          <div class="section-title">
            <h2>カテゴリ一覧</h2>
          </div>
          <section class="panel">
            <div class="category-list" id="profile-category-list"></div>
          </section>

          <div class="section-title">
            <h2>データ</h2>
          </div>
          <button class="danger-button" type="button" id="reset-button">記録を0からやり直す</button>
        </section>
      </div>
    </div>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button class="nav-button is-active" type="button" data-nav="home">ホーム</button>
      <button class="nav-button" type="button" data-nav="add">記録</button>
      <button class="nav-button" type="button" data-nav="stats">統計</button>
      <button class="nav-button" type="button" data-nav="profile">マイ</button>
    </nav>

    <div class="toast" id="toast" role="status"></div>

    <script>
      (() => {
        const recordKey = "gosa-savings-records-v3";
        const categoryKey = "gosa-savings-categories-v3";
        const yen = new Intl.NumberFormat("ja-JP", {
          style: "currency",
          currency: "JPY",
          maximumFractionDigits: 0,
        });

        const defaultCategories = [
          { id: "traffic", name: "交通", example: "タクシーを使わず歩けた" },
          { id: "food", name: "食事", example: "味玉トッピングを見送った" },
          { id: "shopping", name: "ショッピング", example: "必要以上の買い物をやめた" },
          { id: "fixed", name: "固定費見直し", example: "惰性のサブスクを整理した" },
          { id: "social", name: "交際費", example: "行かなくて良い飲み会を断れた" },
          { id: "other", name: "その他", example: "なんとなくの出費を見送った" },
        ];

        const state = {
          records: readJson(recordKey, []),
          categories: mergeCategories(readJson(categoryKey, [])),
          selectedCategoryId: "traffic",
          activeScreen: "home",
        };

        const els = {
          screens: document.querySelectorAll(".screen"),
          navButtons: document.querySelectorAll("[data-nav]"),
          homeTotal: document.getElementById("home-total"),
          homeMonth: document.getElementById("home-month"),
          homeMascot: document.getElementById("home-mascot"),
          stageName: document.getElementById("stage-name"),
          recordCount: document.getElementById("record-count"),
          latestLabel: document.getElementById("latest-label"),
          historyList: document.getElementById("history-list"),
          recordForm: document.getElementById("record-form"),
          amountInput: document.getElementById("amount-input"),
          memoInput: document.getElementById("memo-input"),
          dateInput: document.getElementById("date-input"),
          categoryChips: document.getElementById("category-chips"),
          categoryExample: document.getElementById("category-example"),
          newCategoryInput: document.getElementById("new-category-input"),
          addCategoryButton: document.getElementById("add-category-button"),
          statsTotal: document.getElementById("stats-total"),
          statsMonth: document.getElementById("stats-month"),
          monthBars: document.getElementById("month-bars"),
          categoryBars: document.getElementById("category-bars"),
          profileStage: document.getElementById("profile-stage"),
          profileCount: document.getElementById("profile-count"),
          profileCategories: document.getElementById("profile-categories"),
          profileCategoryList: document.getElementById("profile-category-list"),
          resetButton: document.getElementById("reset-button"),
          toast: document.getElementById("toast"),
        };

        els.dateInput.value = new Date().toISOString().slice(0, 10);
        renderCategoryChips();
        renderAll();
        bindEvents();

        if ("serviceWorker" in navigator && location.protocol !== "file:") {
          window.addEventListener("load", () => {
            navigator.serviceWorker.register("./sw.js").catch(() => {});
          });
        }

        function bindEvents() {
          els.navButtons.forEach((button) => {
            button.addEventListener("click", () => navigate(button.dataset.nav));
          });

          els.recordForm.addEventListener("submit", (event) => {
            event.preventDefault();
            saveRecord();
          });

          els.addCategoryButton.addEventListener("click", addCategory);
          els.newCategoryInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
              event.preventDefault();
              addCategory();
            }
          });

          els.resetButton.addEventListener("click", () => {
            if (!confirm("保存した記録を削除して0から始めますか？")) return;
            state.records = [];
            localStorage.setItem(recordKey, JSON.stringify(state.records));
            renderAll();
            showToast("記録をリセットしました");
            navigate("home");
          });
        }

        function navigate(screenName) {
          state.activeScreen = screenName;
          els.screens.forEach((screen) => {
            screen.classList.toggle("is-active", screen.id === `screen-${screenName}`);
          });
          document.querySelectorAll(".nav-button").forEach((button) => {
            button.classList.toggle("is-active", button.dataset.nav === screenName);
          });
          if (screenName === "add") {
            setTimeout(() => els.amountInput.focus({ preventScroll: true }), 120);
          }
        }

        function saveRecord() {
          const amount = Number(els.amountInput.value);
          const category = getSelectedCategory();
          const memo = els.memoInput.value.trim() || category.example;
          const date = els.dateInput.value || new Date().toISOString().slice(0, 10);

          if (!amount || amount < 1) {
            showToast("金額を入力してください");
            els.amountInput.focus({ preventScroll: true });
            return;
          }

          const nextRecord = {
            id: `record-${Date.now()}`,
            amount,
            categoryId: category.id,
            categoryName: category.name,
            memo,
            date,
          };

          state.records.unshift(nextRecord);
          localStorage.setItem(recordKey, JSON.stringify(state.records));

          els.amountInput.value = "";
          els.memoInput.value = "";
          els.dateInput.value = new Date().toISOString().slice(0, 10);

          renderAll();
          showToast("誤差を記録しました");
          navigate("home");
        }

        function addCategory() {
          const name = els.newCategoryInput.value.trim();
          if (!name) {
            showToast("追加するカテゴリ名を入力してください");
            els.newCategoryInput.focus({ preventScroll: true });
            return;
          }

          const exists = state.categories.some((category) => category.name === name);
          if (exists) {
            showToast("同じカテゴリがすでにあります");
            return;
          }

          const category = {
            id: `custom-${Date.now()}`,
            name,
            example: `${name}の出費を見送った`,
            custom: true,
          };
          state.categories.push(category);
          state.selectedCategoryId = category.id;
          localStorage.setItem(categoryKey, JSON.stringify(state.categories.filter((item) => item.custom)));
          els.newCategoryInput.value = "";
          renderCategoryChips();
          renderAll();
          showToast("カテゴリを追加しました");
        }

        function renderAll() {
          const stats = getStats();
          const stage = getStage(stats.total);
          renderHome(stats, stage);
          renderHistory();
          renderStats(stats);
          renderProfile(stats, stage);
        }

        function renderHome(stats, stage) {
          els.homeTotal.textContent = yen.format(stats.total);
          els.homeMonth.textContent = `今月 ${yen.format(stats.currentMonth)}`;
          els.homeMascot.className = `mascot-wrap stage-${stage.level}`;
          els.stageName.textContent = stage.name;
          els.recordCount.textContent = `${state.records.length}件記録`;
          els.latestLabel.textContent = state.records.length ? "直近5件" : "まだ記録はありません";
        }

        function renderHistory() {
          if (!state.records.length) {
            els.historyList.innerHTML = `<div class="empty-card">まだ記録はありません。大きなボタンから、今日守れたお金を記録しましょう。</div>`;
            return;
          }

          els.historyList.innerHTML = state.records
            .slice(0, 5)
            .map((record) => {
              return `
                <article class="record-card">
                  <div>
                    <p>${escapeHtml(record.memo)}</p>
                    <small>${escapeHtml(record.categoryName)}・${escapeHtml(record.date)}</small>
                  </div>
                  <strong>+${yen.format(record.amount)}</strong>
                </article>
              `;
            })
            .join("");
        }

        function renderStats(stats) {
          els.statsTotal.textContent = yen.format(stats.total);
          els.statsMonth.textContent = yen.format(stats.currentMonth);
          renderBars(els.monthBars, stats.byMonth, "まだ月別データはありません");
          renderBars(els.categoryBars, stats.byCategory, "まだカテゴリ別データはありません");
        }

        function renderProfile(stats, stage) {
          els.profileStage.textContent = stage.name;
          els.profileCount.textContent = `${state.records.length}件`;
          els.profileCategories.textContent = `${state.categories.length}個`;
          els.profileCategoryList.innerHTML = state.categories
            .map((category) => {
              return `
                <div class="record-card">
                  <div>
                    <p>${escapeHtml(category.name)}</p>
                    <small>${escapeHtml(category.example)}</small>
                  </div>
                  <strong>${category.custom ? "追加" : "標準"}</strong>
                </div>
              `;
            })
            .join("");
        }

        function renderBars(container, rows, emptyText) {
          if (!rows.length) {
            container.innerHTML = `<div class="empty-card">${emptyText}</div>`;
            return;
          }
          const max = Math.max(...rows.map((row) => row.amount), 1);
          container.innerHTML = rows
            .map((row) => {
              const width = Math.max(8, Math.round((row.amount / max) * 100));
              return `
                <div class="bar-row">
                  <span>${escapeHtml(row.label)}</span>
                  <div class="bar-track"><div class="bar-fill" style="--width: ${width}%"></div></div>
                  <strong>${yen.format(row.amount)}</strong>
                </div>
              `;
            })
            .join("");
        }

        function renderCategoryChips() {
          els.categoryChips.innerHTML = state.categories
            .map((category) => {
              const selected = category.id === state.selectedCategoryId ? " is-selected" : "";
              return `<button class="category-chip${selected}" type="button" data-category-id="${category.id}" role="radio" aria-checked="${selected ? "true" : "false"}">${escapeHtml(category.name)}</button>`;
            })
            .join("");

          els.categoryChips.querySelectorAll("[data-category-id]").forEach((button) => {
            button.addEventListener("click", () => {
              state.selectedCategoryId = button.dataset.categoryId;
              els.categoryChips.querySelectorAll(".category-chip").forEach((chip) => {
                const selected = chip.dataset.categoryId === state.selectedCategoryId;
                chip.classList.toggle("is-selected", selected);
                chip.setAttribute("aria-checked", selected ? "true" : "false");
              });
              const category = getSelectedCategory();
              els.categoryExample.textContent = `例: ${category.example}`;
              if (!els.memoInput.value.trim()) {
                els.memoInput.placeholder = `例: ${category.example}`;
              }
            });
          });

          const category = getSelectedCategory();
          els.categoryExample.textContent = `例: ${category.example}`;
          els.memoInput.placeholder = `例: ${category.example}`;
        }

        function getStats() {
          const total = state.records.reduce((sum, record) => sum + Number(record.amount), 0);
          const nowMonth = new Date().toISOString().slice(0, 7);
          const currentMonth = state.records
            .filter((record) => record.date.slice(0, 7) === nowMonth)
            .reduce((sum, record) => sum + Number(record.amount), 0);
          const monthMap = new Map();
          const categoryMap = new Map();

          state.records.forEach((record) => {
            const month = record.date.slice(0, 7);
            monthMap.set(month, (monthMap.get(month) || 0) + Number(record.amount));
            categoryMap.set(record.categoryName, (categoryMap.get(record.categoryName) || 0) + Number(record.amount));
          });

          const byMonth = [...monthMap.entries()]
            .sort(([a], [b]) => a.localeCompare(b))
            .map(([label, amount]) => ({ label: `${Number(label.slice(5))}月`, amount }));
          const byCategory = [...categoryMap.entries()]
            .sort((a, b) => b[1] - a[1])
            .map(([label, amount]) => ({ label, amount }));

          return { total, currentMonth, byMonth, byCategory };
        }

        function getStage(total) {
          if (total < 10) return { level: 0, name: "はじまり" };
          if (total < 100) return { level: 1, name: "小さな芽" };
          if (total < 1000) return { level: 2, name: "若葉" };
          if (total < 10000) return { level: 3, name: "花ひらく" };
          if (total < 100000) return { level: 4, name: "金の鉢" };
          return { level: 5, name: "王冠の貯金樹" };
        }

        function getSelectedCategory() {
          return state.categories.find((category) => category.id === state.selectedCategoryId) || state.categories[0];
        }

        function mergeCategories(customCategories) {
          const cleanCustom = Array.isArray(customCategories) ? customCategories.filter((item) => item && item.name) : [];
          return [...defaultCategories, ...cleanCustom];
        }

        function readJson(key, fallback) {
          try {
            const value = JSON.parse(localStorage.getItem(key) || "null");
            return value ?? fallback;
          } catch {
            return fallback;
          }
        }

        function showToast(message) {
          els.toast.textContent = message;
          els.toast.classList.add("is-visible");
          window.clearTimeout(showToast.timer);
          showToast.timer = window.setTimeout(() => {
            els.toast.classList.remove("is-visible");
          }, 2200);
        }

        function escapeHtml(value) {
          return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }
      })();
    </script>
  </body>
</html>
