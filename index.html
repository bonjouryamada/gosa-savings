<!doctype html>
<html lang="ja">

    <title>誤差貯金 - スマホプレビュー</title>
    <style>

        --green-dark: #075b48;
        --mint: #e8f6f0;
        --soft: #f6faf7;
        --gold: #f5c95b;
        --rose: #f3a38e;
        --blue: #7ca0ce;

        --soft-shadow: 0 8px 24px rgba(20, 58, 49, 0.1);

      * {

      }

      html,

      }

      body {

        color: var(--ink);
        background:

          radial-gradient(circle at 78% 82%, rgba(231, 216, 145, 0.24), transparent 22rem),

      .status {

        align-items: end;
        justify-content: space-between;
        padding: 0 26px 5px;

        font-size: 15px;

      .signal i:nth-child(2) { height: 7px; }
      .signal i:nth-child(3) { height: 10px; }

        height: 10px;

        border-left-color: transparent;
        border-right-color: transparent;
        border-bottom: 0;
        border-radius: 14px 14px 0 0;
      }

      .battery {
        width: 22px;
        height: 11px;
        border: 2px solid #111;
        border-radius: 3px;
        position: relative;
      }

      .battery::before {
        content: "";
        position: absolute;
        right: -5px;
        top: 2px;
        width: 2px;
        height: 5px;
        border-radius: 0 2px 2px 0;
        background: #111;
      }

      .battery::after {
        content: "";
        position: absolute;
        inset: 2px 5px 2px 2px;
        border-radius: 1px;
        background: #111;
      }

      .topbar {
        height: 84px;
        display: grid;
        grid-template-columns: 52px 1fr 52px;
        align-items: center;
        padding: 10px 22px 8px;
      }

      .topbar h1 {
        margin: 0;
        text-align: center;
        font-size: 21px;
        letter-spacing: 0;
      }

      .icon-button {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        color: #40524c;
        background: transparent;
        cursor: pointer;
      }

      .icon-button svg,
      .tab-button svg,
      .chevron svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .screens {
        flex: 1;
        position: relative;
        overflow: hidden;

      .screen {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        padding: 0 16px 104px;
        opacity: 0;
        pointer-events: none;
        transform: translateX(16px);
        transition: opacity 240ms ease, transform 240ms ease;
        scrollbar-width: none;
      }

      .screen::-webkit-scrollbar {
        display: none;
      }

      .screen.active {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(0);
      }

      .tone-rose { background: #ffe8de; }

      .asset-icon {

        height: 32px;

      }

      .history-body {

      .history-body p {

        white-space: nowrap;

        text-overflow: ellipsis;
      }

      .amount-plus {
        color: var(--green);
        font-size: 17px;
        font-weight: 800;
        white-space: nowrap;
      }

      .chevron {
        border: 0;
        background: transparent;
        color: #6f7c78;
        padding: 0;
      }

      .quick-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 14px;
      }

      .quick-card {
        min-height: 90px;
        padding: 10px 8px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
        display: grid;
        place-items: center;
        color: var(--ink);
        cursor: pointer;
        box-shadow: 0 7px 18px rgba(20, 58, 49, 0.08);
      }

      .quick-card span {
        font-size: 12px;
        font-weight: 700;
      }

      .quick-card b {
        color: var(--green);
        font-size: 14px;
      }

      .add-screen {

      }

      .add-hero {
        text-align: center;
        padding: 2px 10px 18px;
      }

      .sprout {
        font-size: 32px;
        line-height: 1;
        animation: sprout 1.9s ease-in-out infinite;
      }

      .add-hero h2 {
        margin: 14px 0 8px;
        font-size: 26px;
      }

      .add-hero p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .input-card {
        padding: 22px 16px 14px;
      }

      .field-label {
        display: block;
        font-weight: 700;
      }

      .amount-entry {
        margin-top: 14px;
        display: grid;
        grid-template-columns: 44px 1fr;
        align-items: center;
        border-bottom: 1px solid var(--line);
      }

      .amount-entry span {
        color: var(--green-dark);
        font-size: 34px;
        font-weight: 800;
      }

      .amount-entry input {
        width: 100%;
        border: 0;
        outline: 0;
        color: var(--green);
        font-size: 58px;
        line-height: 1;
        font-weight: 800;
        text-align: right;
        background: transparent;
        font-variant-numeric: tabular-nums;
      }

      .amount-entry input::placeholder {
        color: rgba(11, 141, 103, 0.36);
      }

      .shortcut-row,
      .category-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .shortcut-row {
        margin: 16px 0 24px;
      }

      .shortcut-row button {
        flex: 1 1 72px;
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #fdfdfd;
        color: #38443f;
        cursor: pointer;
      }

      .memo-label textarea {
        width: 100%;
        min-height: 86px;
        margin-top: 8px;
        padding: 12px;
        resize: none;
        border: 1px solid var(--line);
        border-radius: 12px;
        outline: 0;
        background: #fff;
      }

      .counter {
        display: block;
        margin-top: 6px;
        text-align: right;
        color: var(--muted);
        font-size: 12px;
      }

      .category-title {
        margin: 22px 8px 10px;
        color: #42524c;
        font-size: 13px;
        font-weight: 700;
      }

      .category-chip {
        min-height: 74px;
        flex: 1 1 88px;
        display: grid;
        place-items: center;
        gap: 3px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fff;
        color: #243a34;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(20, 58, 49, 0.07);
      }

      .category-chip.is-selected {
        border-color: rgba(11, 141, 103, 0.55);
        box-shadow: 0 0 0 3px rgba(11, 141, 103, 0.12);
      }

      .category-chip span {
        font-size: 12px;
        font-weight: 700;
      }

      .save-button {
        width: 100%;
        min-height: 62px;
        margin-top: 28px;
        border: 0;
        border-radius: 15px;
        color: #fff;
        background: linear-gradient(135deg, #19a673, #07845d);
        box-shadow: 0 12px 26px rgba(8, 132, 93, 0.24);
        font-size: 22px;
        font-weight: 800;
        cursor: pointer;
      }

      .save-button:disabled {
        opacity: 0.45;
      }

      .segment {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        margin: 2px 0 30px;
        padding: 4px;
        border-radius: 14px;
        background: #edf4f0;
      }

      .segment button {
        min-height: 42px;
        border: 0;
        border-radius: 11px;
        background: transparent;
        color: #5a6762;
        cursor: pointer;
      }

      .segment .active {
        background: #fff;
        color: var(--green);
        font-weight: 800;
        box-shadow: 0 5px 12px rgba(20, 58, 49, 0.12);
      }

      .chart-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 24px;
      }

      .chart-title h2 {
        margin: 0;
        font-size: 18px;
      }

      .chart-title small {
        color: var(--muted);

        height: 292px;
        display: grid;
        grid-template-columns: 46px 1fr;
        gap: 10px;
      }

      .axis {
        display: grid;
        grid-template-rows: repeat(5, 1fr);
        color: #687671;
        font-size: 12px;
      }

      .bars {
        position: relative;
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        align-items: end;
        gap: 12px;
        padding-top: 22px;
        border-bottom: 1px solid #aab6b0;
      }

      .bars::before {
        content: "";
        position: absolute;
        inset: 22px 0 0;
        background: repeating-linear-gradient(to bottom, rgba(20, 58, 49, 0.12), rgba(20, 58, 49, 0.12) 1px, transparent 1px, transparent 61px);
      }

      .bar {
        height: 100%;
        position: relative;
        display: grid;
        grid-template-rows: 1fr 48px;
        justify-items: center;
      }

      .bar-fill {
        width: 28px;
        align-self: end;
        border-radius: 5px 5px 0 0;
        background: linear-gradient(180deg, #d7eadf, #b5dec9);
        animation: grow 800ms ease both;
        transform-origin: bottom;
        z-index: 1;
      }

      .bar.current .bar-fill {
        background: linear-gradient(180deg, #13986d, #0d765a);
      }

      .bar-value {
        position: absolute;
        top: calc(100% - var(--bar-height) - 22px);
        transform: translateY(-100%);
        color: #4d5e57;
        font-size: 11px;
        white-space: nowrap;
        z-index: 2;
      }

      .bar.current .bar-value {
        color: var(--green-dark);
        font-weight: 800;
      }

      .bar-label {
        display: grid;
        place-items: center;
        color: #56645f;
        font-size: 12px;
        text-align: center;
        line-height: 1.35;
      }

      .stat-cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 28px;
      }

      .stat-card {
        min-height: 128px;
        padding: 16px;
        text-align: center;
      }

      .stat-card span {
        font-weight: 800;
      }

      .stat-card strong {
        display: block;
        margin-top: 12px;
        color: var(--green-dark);
        font-size: 28px;
      }

      .stat-card small {
        display: block;
        margin-top: 6px;
      }

      .encourage {
        min-height: 132px;
        margin-top: 18px;
        padding: 20px 118px 18px 22px;
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, #eef9f4, #fff);
      }

      .encourage h3 {
        margin: 0 0 8px;
        color: #0f765d;
        font-size: 16px;
      }

      .encourage p {
        margin: 0;
        color: #596b64;
        font-size: 13px;
        line-height: 1.7;
      }

      .encourage img {
        position: absolute;
        width: 130px;
        right: -4px;
        bottom: -20px;
      }

      .bottom-nav {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 78px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        padding: 7px 14px 9px;
        border-top: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(16px);
      }

      .tab-button {
        display: grid;
        place-items: center;
        gap: 2px;
        border: 0;
        background: transparent;
        color: #68716e;
        cursor: pointer;
      }

      .tab-button span {
        font-size: 11px;
        font-weight: 700;
      }

      .tab-button.active {
        color: var(--green);
      }

      @keyframes floaty {
        0%, 100% { transform: translateY(0) rotate(-1deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }

      @keyframes twinkle {
        0%, 100% { opacity: 0.35; transform: scale(0.82); }
        50% { opacity: 1; transform: scale(1.12); }
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes sprout {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-4px) scale(1.05); }
      }

      @keyframes grow {
        from { transform: scaleY(0.2); opacity: 0.5; }
        to { transform: scaleY(1); opacity: 1; }
      }

      @media (max-width: 430px) {
        body {
          padding: 0;
          background: #fff;
        }

        .phone {
          width: 100vw;
          height: 100vh;
          min-height: 680px;
          border-radius: 0;
          border: 0;
        }
      }
    </style>
  </head>

        ramen: { label: "ラーメン", tone: "gold", icon: "icon-ramen-trimmed.png", amount: 320, memo: "ラーメンのトッピングを我慢" },
        shopping: { label: "ショッピング", tone: "rose", icon: "icon-shopping-trimmed.png", amount: 1480, memo: "予定外の買い物を見送った" },
        subscription: { label: "サブスク", tone: "blue", icon: "icon-subscription-trimmed.png", amount: 980, memo: "使っていないサブスクを停止" }
      };
      const nav = [
        ["home", "ホーム", icons.home],
        ["add", "記録する", icons.plus],
        ["stats", "統計", icons.chart],
        ["mypage", "マイページ", icons.user]
      ];

      function Icon(path) {
        return h("svg", { viewBox: "0 0 24 24", "aria-hidden": "true" }, h("path", { d: path }));
      }

      function CategoryIcon(key) {
        return h("img", { class: "asset-icon", src: asset(categories[key].icon), alt: "" });
      }

      function total() {
        return state.records.reduce((sum, record) => sum + record.amount, 123250);
      }

      function renderNode(vnode) {
        if (vnode == null || vnode === false) return document.createTextNode("");
        if (typeof vnode === "string" || typeof vnode === "number") return document.createTextNode(vnode);
        const el = document.createElement(vnode.tag);
        Object.entries(vnode.props || {}).forEach(([key, value]) => {
          if (key === "class") el.className = value;
          else if (key === "style" && typeof value === "object") Object.assign(el.style, value);
          else if (key.startsWith("on") && typeof value === "function") el.addEventListener(key.slice(2).toLowerCase(), value);
          else if (value !== false && value != null) el.setAttribute(key, value === true ? "" : value);
        });
        vnode.children.forEach((child) => el.appendChild(renderNode(child)));
        return el;
      }

      function setState(patch) {
        Object.assign(state, patch);
        render();
      }

      function saveRecord(amount, memo, category) {
        const nextAmount = Number(amount || state.amount);
        if (!nextAmount) return;
        const cat = category || state.category;
        state.records = [
          { id: Date.now(), category: cat, memo: memo || state.memo.split("\n")[0] || "小さな誤差を貯金", detail: (memo || state.memo).split("\n")[1] || "今日の小さな見送り", amount: nextAmount, fresh: true },
          ...state.records.map((record) => ({ ...record, fresh: false }))
        ];
        state.amount = "";
        state.memo = "";
        state.tab = "home";
        render();
      }

      function StatusBar() {
        return h("div", { class: "status" },
          h("span", null, "9:41"),
          h("div", { class: "status-icons" },
            h("span", { class: "signal" }, h("i"), h("i"), h("i")),
            h("span", { class: "wifi" }),
            h("span", { class: "battery" })
          )
        );
      }

      function TopBar() {
        const title = state.tab === "add" ? "誤差を記録" : state.tab === "stats" ? "統計" : "誤差貯金";
        const leftIcon = state.tab === "add" ? icons.back : icons.menu;
        const rightIcon = state.tab === "stats" ? icons.calendar : icons.bell;
        return h("header", { class: "topbar" },
          h("button", { class: "icon-button", type: "button", "aria-label": "戻る", onclick: () => setState({ tab: "home" }) }, Icon(leftIcon)),
          h("h1", null, title),
          h("button", { class: "icon-button", type: "button", "aria-label": "通知" }, Icon(rightIcon))
        );
      }

      function Home() {
        const quicks = ["taxi", "ramen", "subscription"];
        return h("section", { class: "screen " + (state.tab === "home" ? "active" : "") },
          h("section", { class: "card balance-card" },
            h("div", null,
              h("span", { class: "eyebrow" }, "合計貯金額", h("span", { class: "info-dot" }, "i")),
              h("strong", { class: "big-money" }, yen(total())),
              h("span", { class: "pill" }, "先月比 +¥12,830", Icon(icons.up))
            ),
            h("div", { class: "mascot-wrap" },
              h("span", { class: "sparkle one" }, "✦"),
              h("img", { class: "mascot", src: asset("mascot-trimmed.png"), alt: "誤差貯金のマスコット" }),
              h("span", { class: "sparkle two" }, "✦")
            )
          ),
          h("section", { class: "card month-card" },
            h("div", null,
              h("span", { class: "label" }, "今月守れたお金"),
              h("strong", null, "¥18,760"),
              h("small", null, "月の目標 ¥20,000")
            ),
            h("div", { class: "ring" }, h("span", null, "93%")),
            h("button", { class: "chevron", type: "button", onclick: () => setState({ tab: "stats" }) }, Icon(icons.chevron))
          ),
          h("div", { class: "quick-row" }, quicks.map((key) =>
            h("button", { class: "quick-card", type: "button", onclick: () => saveRecord(categories[key].amount, categories[key].memo, key) },
              CategoryIcon(key), h("span", null, categories[key].label), h("b", null, yen(categories[key].amount))
            )
          )),
          h("div", { class: "section-row" },
            h("h2", null, "履歴"),
            h("button", { class: "text-link", type: "button", onclick: () => setState({ tab: "add" }) }, "すべて見る", Icon(icons.chevron))
          ),
          h("section", { class: "card history" }, state.records.slice(0, 4).map((record) => HistoryItem(record)))
        );
      }

      function HistoryItem(record) {
        const cat = categories[record.category] || categories.shopping;
        return h("article", { class: "history-item", style: { animationDelay: record.fresh ? "0ms" : "80ms" } },
          h("div", { class: "history-icon tone-" + cat.tone }, CategoryIcon(record.category)),
          h("div", { class: "history-body" }, h("p", null, record.memo), h("small", null, record.detail)),
          h("strong", { class: "amount-plus" }, "+" + yen(record.amount)),
          h("button", { class: "chevron", type: "button", "aria-label": "詳細" }, Icon(icons.chevron))
        );
      }

      function Add() {
        return h("section", { class: "screen add-screen " + (state.tab === "add" ? "active" : "") },
          h("div", { class: "add-hero" },
            h("div", { class: "sprout" }, "🌱"),
            h("h2", null, "誤差を記録"),
            h("p", null, "守れたお金を記録して、未来の自分を応援しよう")
          ),
          h("section", { class: "card input-card" },
            h("label", { class: "field-label" }, "使わなかった金額",
              h("div", { class: "amount-entry" },
                h("span", null, "¥"),
                h("input", { type: "number", min: "1", inputmode: "numeric", placeholder: "0", value: state.amount, oninput: (event) => setState({ amount: event.target.value }) })
              )
            ),
            h("div", { class: "shortcut-row" }, [100, 500, 1000, 5000].map((value) =>
              h("button", { type: "button", onclick: () => setState({ amount: String(value) }) }, "+" + value.toLocaleString("ja-JP"))
            )),
            h("label", { class: "field-label memo-label" }, "メモ",
              h("textarea", { maxlength: "100", rows: "4", placeholder: "タクシーを使わなかった\n渋谷駅 → 恵比寿駅", oninput: (event) => setState({ memo: event.target.value }) }, state.memo)
            ),
            h("span", { class: "counter" }, state.memo.length + "/100")
          ),
          h("p", { class: "category-title" }, "カテゴリを選ぶ（任意）"),
          h("div", { class: "category-row" }, Object.keys(categories).map((key) =>
            h("button", { class: "category-chip " + (state.category === key ? "is-selected" : ""), type: "button", onclick: () => setState({ category: key, amount: String(categories[key].amount), memo: categories[key].memo }) },
              CategoryIcon(key), h("span", null, categories[key].label)
            )
          )),
          h("button", { class: "save-button", type: "button", disabled: Number(state.amount) ? null : true, onclick: () => saveRecord() }, "記録する")
        );
      }

      function Stats() {
        const months = [
          ["12月", "2025", 12450],
          ["1月", "2026", 16380],
          ["2月", "2026", 18920],
          ["3月", "2026", 28460],
          ["4月", "2026", 22130],
          ["5月", "2026", 18760]
        ];
        const max = 40000;
        return h("section", { class: "screen " + (state.tab === "stats" ? "active" : "") },
          h("div", { class: "segment" }, h("button", { class: "active", type: "button" }, "月ごとのグラフ"), h("button", { type: "button" }, "年間のまとめ")),
          h("section", null,
            h("div", { class: "chart-title" }, h("h2", null, "月ごとのグラフ"), h("small", null, "（単位：円）")),
            h("div", { class: "chart" },
              h("div", { class: "axis" }, ["40,000", "30,000", "20,000", "10,000", "0"].map((label) => h("span", null, label))),
              h("div", { class: "bars" }, months.map((month, index) => {
                const height = Math.round((month[2] / max) * 100);
                return h("div", { class: "bar " + (index === months.length - 1 ? "current" : ""), style: { "--bar-height": height + "%" } },
                  h("span", { class: "bar-value" }, month[2].toLocaleString("ja-JP")),
                  h("div", { class: "bar-fill", style: { height: height + "%" } }),
                  h("span", { class: "bar-label" }, month[0], h("br"), month[1])
                );
              }))
            )
          ),
          h("div", { class: "stat-cards" },
            h("section", { class: "card stat-card" }, h("span", null, "月間平均 ", h("span", { class: "info-dot" }, "i")), h("strong", null, "¥19,183")),
            h("section", { class: "card stat-card" }, h("span", null, "ベスト月 👑"), h("strong", null, "¥28,460"), h("small", null, "2026年3月"))
          ),
          h("section", { class: "card encourage" },
            h("h3", null, "コツコツが、大きなチカラに。"),
            h("p", null, "無理なく続けているあなたは、ちゃんと未来を育てています。"),
            h("img", { src: asset("mascot-trimmed.png"), alt: "" })
          )
        );
      }

      function BottomNav() {
        return h("nav", { class: "bottom-nav", "aria-label": "メインナビゲーション" }, nav.map(([key, label, path]) =>
          h("button", { class: "tab-button " + (state.tab === key ? "active" : ""), type: "button", onclick: () => key !== "mypage" && setState({ tab: key }) },
            Icon(path), h("span", null, label)
          )
        ));
      }

      function App() {
        return h("main", { class: "phone" },
          h("div", { class: "app" },
            StatusBar(),
            TopBar(),
            h("div", { class: "screens" }, Home(), Add(), Stats()),
            BottomNav()
          )
        );
      }

      function render() {
        const root = document.getElementById("root");
        root.replaceChildren(renderNode(App()));
      }

      render();
    </script>
  </body>
</html>
