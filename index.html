<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="使わなかった小さなお金を記録し、貯金額と成長を見られるアプリ。"
    />
    <meta name="theme-color" content="#1E7F63" />
    <meta property="og:title" content="誤差貯金" />
    <meta
      property="og:description"
      content="使わなかった小さなお金を記録し、貯金額と成長を見られるアプリ。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./public/icons/app-icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="誤差貯金" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./public/icons/app-icon-192.png" />
    <title>誤差貯金</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f6f3;
        --paper: #ffffff;
        --paper-soft: #fbfcf9;
        --mint: #edf5f1;
        --mint-strong: #dceee6;
        --ink: #17201c;
        --muted: #78817b;
        --line: rgba(23, 32, 28, 0.1);
        --green: #1e7f63;
        --green-deep: #10634c;
        --gold: #d8a437;
        --orange: #df8d54;
        --shadow: 0 18px 50px rgba(27, 54, 43, 0.12);
        font-family: "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--bg);
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 12% 8%, rgba(30, 127, 99, 0.1), transparent 28rem),
          radial-gradient(circle at 88% 12%, rgba(216, 164, 55, 0.16), transparent 24rem),
          linear-gradient(160deg, #fbfbf3 0%, #eef6f1 48%, #f8f3e8 100%);
        color: var(--ink);
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      .app {
        width: min(100%, 520px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 18px 14px 22px;
      }

      .shell {
        min-height: calc(100vh - 40px);
        border: 1px solid var(--line);
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 22px 22px 16px;
        background: linear-gradient(135deg, rgba(237, 245, 241, 0.98), rgba(255, 255, 255, 0.96));
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-icon {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        background: var(--mint);
        object-fit: contain;
        padding: 4px;
      }

      .brand-title {
        margin: 0;
        color: var(--green-deep);
        font-size: 22px;
        line-height: 1.2;
      }

      .brand-sub {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .screen {
        display: none;
        min-height: 680px;
        padding: 18px 18px 104px;
      }

      .screen.is-active {
        display: block;
      }

      .hero-card,
      .panel,
      .record-card,
      .empty-card {
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--paper);
        box-shadow: 0 12px 28px rgba(27, 54, 43, 0.08);
      }

      .hero-card {
        display: grid;
        gap: 18px;
        padding: 20px;
        background: linear-gradient(145deg, var(--mint), #fff 72%);
      }

      .hero-main {
        display: grid;
        grid-template-columns: 1fr 126px;
        align-items: center;
        gap: 16px;
      }

      .label {
        display: block;
        color: var(--green-deep);
        font-size: 13px;
        font-weight: 900;
      }

      .total-amount {
        margin: 4px 0 0;
        color: var(--ink);
        font-size: clamp(42px, 13vw, 62px);
        font-weight: 950;
        line-height: 1.05;
        letter-spacing: 0;
      }

      .month-pill {
        display: inline-flex;
        width: fit-content;
        margin-top: 12px;
        border-radius: 999px;
        background: var(--green);
        color: #fff;
        padding: 8px 14px;
        font-size: 14px;
        font-weight: 900;
      }

      .mascot-wrap {
        position: relative;
        display: grid;
        place-items: center;
        width: 126px;
        height: 126px;
        border-radius: 36px;
        background: rgba(255, 255, 255, 0.8);
      }

      .mascot-wrap::before,
      .mascot-wrap::after {
        position: absolute;
        pointer-events: none;
      }

      .mascot-wrap::before {
        content: "";
        inset: 14px;
        border-radius: 999px;
        background: rgba(216, 164, 55, 0.12);
        transform: scale(var(--aura-scale, 0.7));
      }

      .mascot {
        position: relative;
        z-index: 2;
        width: 92px;
        height: 92px;
        object-fit: contain;
        filter: drop-shadow(0 10px 16px rgba(16, 99, 76, 0.16));
        transform: scale(var(--mascot-scale, 0.86));
      }

      .mascot-wrap::after {
        content: var(--mascot-badge, "");
        z-index: 3;
        right: 8px;
        top: 6px;
        color: var(--gold);
        font-size: 28px;
        font-weight: 900;
        text-shadow: 0 2px 0 rgba(255, 255, 255, 0.8);
      }

      .stage-0 { --mascot-scale: 0.78; --aura-scale: 0.45; }
      .stage-1 { --mascot-scale: 0.84; --aura-scale: 0.62; --mascot-badge: "＊"; }
      .stage-2 { --mascot-scale: 0.92; --aura-scale: 0.78; --mascot-badge: "✦"; }
      .stage-3 { --mascot-scale: 1; --aura-scale: 0.94; --mascot-badge: "✿"; }
      .stage-4 { --mascot-scale: 1.05; --aura-scale: 1.08; --mascot-badge: "★"; }
      .stage-5 { --mascot-scale: 1.1; --aura-scale: 1.18; --mascot-badge: "♛"; }

      .stage-text {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      .primary-button {
        width: 100%;
        border-radius: 22px;
        background: var(--green);
        color: #fff;
        padding: 17px 18px;
        font-size: 18px;
        font-weight: 950;
        box-shadow: 0 16px 30px rgba(30, 127, 99, 0.22);
      }

      .secondary-button {
        border-radius: 18px;
        background: var(--mint);
        color: var(--green-deep);
        padding: 12px 14px;
        font-weight: 900;
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 22px 0 12px;
      }

      .section-title h2 {
        margin: 0;
        color: var(--ink);
        font-size: 18px;
      }

      .muted {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .history-list,
      .stats-grid,
      .category-list,
      .profile-grid {
        display: grid;
        gap: 10px;
      }

      .record-card {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        padding: 14px 16px;
      }

      .record-card p {
        margin: 0;
        font-weight: 900;
      }

      .record-card small {
        color: var(--muted);
        font-weight: 700;
      }

      .record-card strong {
        color: var(--green);
        font-size: 18px;
      }

      .empty-card {
        padding: 18px;
        color: var(--muted);
        font-weight: 700;
        line-height: 1.7;
      }

      .form-card {
        display: grid;
        gap: 16px;
        border: 1px solid var(--line);
        border-radius: 26px;
        background: var(--paper);
        padding: 18px;
        box-shadow: 0 14px 30px rgba(27, 54, 43, 0.08);
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field label,
      .category-label {
        color: var(--green-deep);
        font-size: 13px;
        font-weight: 900;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid rgba(23, 32, 28, 0.12);
        border-radius: 18px;
        background: var(--paper-soft);
        color: var(--ink);
        outline: none;
        padding: 14px 15px;
      }

      input:focus,
      textarea:focus {
        border-color: rgba(30, 127, 99, 0.45);
        box-shadow: 0 0 0 4px rgba(30, 127, 99, 0.1);
      }

      .amount-input {
        font-size: 34px;
        font-weight: 950;
        letter-spacing: 0;
      }

      textarea {
        min-height: 92px;
        resize: vertical;
      }

      .category-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .category-chip {
        border: 1px solid rgba(23, 32, 28, 0.1);
        border-radius: 999px;
        background: #fff;
        color: var(--muted);
        padding: 10px 13px;
        font-size: 14px;
        font-weight: 900;
      }

      .category-chip.is-selected {
        border-color: transparent;
        background: var(--green);
        color: #fff;
      }

      .example-box {
        border-radius: 18px;
        background: var(--mint);
        color: var(--green-deep);
        padding: 12px 14px;
        font-size: 13px;
        font-weight: 800;
        line-height: 1.6;
      }

      .inline-form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }

      .panel {
        padding: 16px;
      }

      .stat-card {
        display: grid;
        gap: 4px;
        border-radius: 20px;
        background: var(--mint);
        padding: 16px;
      }

      .stat-card span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .stat-card strong {
        color: var(--green-deep);
        font-size: 24px;
      }

      .bar-list {
        display: grid;
        gap: 12px;
      }

      .bar-row {
        display: grid;
        grid-template-columns: 82px 1fr 86px;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      .bar-track {
        height: 16px;
        border-radius: 999px;
        background: var(--mint);
        overflow: hidden;
      }

      .bar-fill {
        width: var(--width);
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--green), var(--gold));
      }

      .profile-card {
        border-radius: 22px;
        background: var(--mint);
        padding: 16px;
      }

      .profile-card span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .profile-card strong {
        display: block;
        margin-top: 4px;
        color: var(--green-deep);
        font-size: 22px;
      }

      .danger-button {
        width: 100%;
        border-radius: 18px;
        background: #fff4ef;
        color: #9b3f26;
        padding: 13px 16px;
        font-weight: 900;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 86px;
        z-index: 20;
        width: min(calc(100% - 36px), 460px);
        transform: translateX(-50%);
        border-radius: 18px;
        background: var(--ink);
        color: #fff;
        padding: 12px 14px;
        text-align: center;
        font-weight: 800;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .toast.is-visible {
        opacity: 1;
        transform: translateX(-50%) translateY(-6px);
      }

      .bottom-nav {
        position: fixed;
        left: 50%;
        bottom: 14px;
        z-index: 10;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        width: min(calc(100% - 32px), 488px);
        border: 1px solid var(--line);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 14px 34px rgba(27, 54, 43, 0.14);
        padding: 6px;
        transform: translateX(-50%);
      }

      .nav-button {
        border-radius: 18px;
        background: transparent;
        color: var(--muted);
        padding: 10px 4px;
        font-size: 12px;
        font-weight: 900;
      }

      .nav-button.is-active {
        background: var(--mint);
        color: var(--green-deep);
      }

      @media (max-width: 420px) {
        .app {
          padding: 0;
        }

        .shell {
          min-height: 100vh;
          border: 0;
          border-radius: 0;
        }

        .hero-main {
          grid-template-columns: 1fr 108px;
        }

        .mascot-wrap {
          width: 108px;
          height: 108px;
        }

        .mascot {
          width: 82px;
          height: 82px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>このアプリを利用するにはJavaScriptを有効にしてください。</noscript>
    <script src="./growth-stages.js?v=14" defer></script>
    <script src="./app-v7.js?v=14" defer></script>
</body>
</html>
